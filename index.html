<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Música para Anxo</title>
    <style>
      :root {
        font-family: system-ui, -apple-system, sans-serif;
        background: #111827;
        color: #f9fafb;
      }
      body {
        margin: 0;
        max-width: 640px;
        margin-inline: auto;
        padding: 16px;
      }
      h1 {
        font-size: 1.4rem;
        margin: 8px 0 16px;
      }
      #buscar {
        width: 100%;
        box-sizing: border-box;
        background: #1f2937;
        color: #f9fafb;
        border: 1px solid #4b5563;
        border-radius: 8px;
        padding: 10px 12px;
        margin-bottom: 8px;
        font-size: 1rem;
      }
      #buscar:focus {
        outline: 2px solid #6b7280;
        border-color: transparent;
      }
      #sin-resultados {
        color: #9ca3af;
        padding: 16px 4px;
      }
      .album {
        display: flex;
        align-items: flex-start;
        width: 100%;
        text-align: left;
        background: none;
        color: inherit;
        border: none;
        border-bottom: 1px solid #374151;
        padding: 10px 4px;
        margin: 0;
        font-size: 1rem;
        cursor: pointer;
      }
      .album:active {
        background: #1f2937;
      }
      .album .num {
        color: #9ca3af;
        flex: none;
        min-width: 34px;
      }
      .album .txt {
        flex: 1;
        min-width: 0;
      }
      .album .nombre,
      .album .hint {
        display: block;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .album .artista {
        color: #9ca3af;
      }
      .album.fav .titulo {
        color: #fbbf24;
        font-weight: 600;
      }
      .album.fav .titulo::before {
        content: "★ ";
      }
      #album-title.fav {
        color: #fbbf24;
      }
      .album .hint {
        margin-top: 2px;
        font-size: 0.85rem;
        color: #9ca3af;
      }
      .track {
        display: flex;
        gap: 12px;
        padding: 12px 8px;
        border-bottom: 1px solid #374151;
      }
      .track:last-child {
        border-bottom: none;
      }
      .track .num {
        color: #9ca3af;
        min-width: 24px;
      }
      #back {
        background: none;
        border: 1px solid #4b5563;
        color: #f9fafb;
        border-radius: 8px;
        padding: 8px 16px;
        margin-bottom: 16px;
        font-size: 0.95rem;
        cursor: pointer;
      }
      .hidden {
        display: none;
      }
      /* Cabeceras fijas al hacer scroll */
      .cabecera-fija {
        position: sticky;
        top: 0;
        z-index: 10;
        background: #111827;
        margin: -16px -16px 0;
        padding: 16px 16px 8px;
        border-bottom: 1px solid #374151;
      }
      .cabecera-fija h1 {
        margin: 8px 0 12px;
      }
      .cabecera-fija #buscar {
        margin-bottom: 0;
      }
      .cabecera-fija #back {
        margin-bottom: 8px;
      }
      /* Vista de canciones: título a la izquierda, botón a la derecha */
      #detalle .cabecera-fija {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding-bottom: 12px;
      }
      #detalle .cabecera-fija h1 {
        flex: 1;
        min-width: 0;
        margin: 0;
      }
      #detalle .cabecera-fija #back {
        flex: none;
        margin: 0;
      }
    </style>
  </head>

    <div id="principal">
      <div class="cabecera-fija">
        <h1>Música para Anxo</h1>
        <input
          id="buscar"
          type="search"
          placeholder="Buscar artista, disco o canción…"
          autocomplete="off"
        />
      </div>
      <div id="lista"></div>
      <div id="sin-resultados" class="hidden">No hay resultados.</div>
    </div>

    <div id="detalle" class="hidden">
      <div class="cabecera-fija">
        <h1 id="album-title"></h1>
        <button id="back">← Volver a los discos</button>
      </div>
      <div id="tracks"></div>
    </div>

    <script>
      const principal = document.getElementById("principal");
      const lista = document.getElementById("lista");
      const detalle = document.getElementById("detalle");
      const buscar = document.getElementById("buscar");
      const sinResultados = document.getElementById("sin-resultados");

      // "Artista - Título", o solo el título si no hay artista
      function etiqueta(d) {
        return d.artista ? d.artista + " - " + d.titulo : d.titulo;
      }

      // Quita tildes y mayúsculas para comparar
      function normalizar(texto) {
        return texto
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .toLowerCase();
      }

      // Pinta el listado de discos (filtrado por la búsqueda)
      function pintarLista() {
        const q = normalizar(buscar.value.trim());
        lista.innerHTML = "";
        let visibles = 0;

        discos.forEach((disco, i) => {
          let pistaCoincidente = null;
          if (q) {
            const enDisco = normalizar(disco.artista + " " + disco.titulo).includes(q);
            if (!enDisco) {
              pistaCoincidente = disco.pistas.find((p) => normalizar(p).includes(q));
              if (!pistaCoincidente) return;
            }
          }

          visibles++;
          const btn = document.createElement("button");
          btn.className = disco.favorito ? "album fav" : "album";
          const num = String(i + 1).padStart(2, "0");

          const spanNum = document.createElement("span");
          spanNum.className = "num";
          spanNum.textContent = num;
          btn.appendChild(spanNum);
          const txt = document.createElement("span");
          txt.className = "txt";
          const nombre = document.createElement("span");
          nombre.className = "nombre";
          if (disco.artista) {
            const art = document.createElement("span");
            art.className = "artista";
            art.textContent = disco.artista + " - ";
            nombre.appendChild(art);
          }
          const tit = document.createElement("span");
          tit.className = "titulo";
          tit.textContent = disco.titulo;
          nombre.appendChild(tit);
          txt.appendChild(nombre);

          if (pistaCoincidente) {
            const hint = document.createElement("span");
            hint.className = "hint";
            hint.textContent = "Pista: " + pistaCoincidente;
            txt.appendChild(hint);
          }
          btn.appendChild(txt);

          btn.onclick = () => mostrarDisco(i);
          lista.appendChild(btn);
        });

        sinResultados.classList.toggle("hidden", visibles > 0);
      }

      function mostrarDisco(i) {
        const disco = discos[i];
        document.getElementById("album-title").textContent = disco.titulo;
        document.getElementById("album-title").classList.toggle("fav", !!disco.favorito);
        const tracks = document.getElementById("tracks");
        tracks.innerHTML = "";
        disco.pistas.forEach((p, n) => {
          const row = document.createElement("div");
          row.className = "track";
          const spanNum = document.createElement("span");
          spanNum.className = "num";
          spanNum.textContent = n + 1;
          const spanTxt = document.createElement("span");
          spanTxt.textContent = p;
          row.appendChild(spanNum);
          row.appendChild(spanTxt);
          tracks.appendChild(row);
        });
        principal.classList.add("hidden");
        detalle.classList.remove("hidden");
        window.scrollTo(0, 0);
      }

      document.getElementById("back").onclick = () => {
        detalle.classList.add("hidden");
        principal.classList.remove("hidden");
      };

      buscar.addEventListener("input", pintarLista);
      pintarLista();
    </script>
  </body>
</html>
